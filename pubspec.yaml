name: isle
description: Your island. Your algorithm.
version: 1.6.0+380

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 백엔드
  supabase_flutter: ^2.3.0

  # 상태관리
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # 네비게이션
  go_router: ^13.2.0

  # 인앱 뷰어
  webview_flutter: ^4.4.0
  webview_flutter_wkwebview: ^3.25.0
  youtube_player_flutter: ^9.0.2

  # 로컬 캐시
  hive_flutter: ^1.1.0

  # UI/UX
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # 유틸
  dio: ^5.4.0
  xml: ^6.5.0
  html: ^0.15.4
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  http: ^1.2.0
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  share_plus: ^7.2.0
  receive_sharing_intent: ^1.8.0
  google_sign_in: ^6.2.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  fl_chart: ^0.69.2
  file_picker: ^8.1.7
  app_links: ^7.0.0
  flutter_local_notifications: ^19.0.0
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0
  firebase_core: ^4.10.0
  firebase_analytics: ^12.4.2
  flutter_secure_storage: ^10.3.1
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0
  flutter_lints: ^3.0.0
  json_serializable: ^6.7.0
  flutter_launcher_icons: ^0.14.4
  # 스플래시는 네이티브 res에 이미 반영됨. 재생성 시만 일시 추가:
  # flutter_native_splash: ^2.4.6  → dart run flutter_native_splash:create

flutter:
  uses-material-design: true
  assets:
    - assets/premade_block_packs/manifest.json
    - assets/premade_block_packs/premade_adult_youtube_200.json
    - assets/premade_block_packs/premade_adult_sites_200.json
    - assets/premade_block_packs/premade_juso4_adult_board.json
    - assets/premade_block_packs/premade_jusoland_adult_boards.json
    - assets/premade_block_packs/premade_jusoland_illegal_sites.json
    - assets/premade_block_packs/premade_naver_adult_photo_blogs.json
    - assets/premade_block_packs/premade_yugiyu_adult.json
    - assets/premade_block_packs/premade_jusoguide_adult.json
    - assets/premade_block_packs/premade_link_aggregator_seo.json
    - assets/premade_block_packs/premade_gaming_400.json
    - assets/premade_block_packs/premade_gambling_200.json
    - assets/content/addiction_insights_ko.json
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: assets/branding/isle_app_icon_source.png
  adaptive_icon_background: "#DDEAF7"
  adaptive_icon_foreground: assets/branding/isle_app_icon_source.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#DDEAF7"
  image: assets/branding/isle_splash_logo_source.png
  ios: true
  android: false
  web: false
  fullscreen: true
